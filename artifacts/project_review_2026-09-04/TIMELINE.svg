<text x="305" y="647" class="" text-anchor="middle">→</text>
<text x="585" y="647" class="" text-anchor="middle">→</text>
<text x="880" y="647" class="" text-anchor="middle">→</text>
<text x="30" y="690" class="muted" text-anchor="start">H is unknown. Weight / strength / fit and CAN / power testing run in parallel; failed tests trigger revision.</text>
