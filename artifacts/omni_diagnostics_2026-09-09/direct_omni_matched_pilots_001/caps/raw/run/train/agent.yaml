seed: 157
device: cuda:0
num_steps_per_env: 24
max_iterations: 50
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - critic
clip_actions: null
check_for_nan: true
save_interval: 1
experiment_name: hexapod_c_omni_flat_history_v1
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.1
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: caps_ppo:CapsPPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 5.0e-05
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.0
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
  caps_options:
    temporal_weight: 0.1
    spatial_weight: 0.1
    noise_scale: 1.0
    noise_seed: 1157
policy: {}
