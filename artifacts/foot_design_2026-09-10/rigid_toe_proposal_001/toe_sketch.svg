<text x="95" y="735" font-size="23" font-weight="700">KEEP THE LENGTH DATUM EXPLICIT</text>
<text x="95" y="779" font-size="22">For the C-study axis: knee → sphere center 111 + radius 15 = distal pole 126</text>
<text x="95" y="820" font-size="20">The 126 mm dimension reaches the axial end of the toe. It is not a fixed ground-contact point.</text>
<text x="95" y="853" font-size="20">Contact moves around the sphere as the leg tilts. Include the new radius and geometry in the URDF.</text>
<text x="95" y="918" font-size="18" fill="#555">Shape proposal only. Check the loaded tilt range so the shoulder and neck stay clear of the ground.</text>
<text x="95" y="948" font-size="18" fill="#555">Existing training assets remain unchanged. R15 is an editable starting dimension, not a qualified optimum.</text>
