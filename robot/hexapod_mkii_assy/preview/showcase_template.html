<title>Hexapod MKII Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Barlow:wght@400;500&display=swap">
<style>
:root{--bg:#ffffff;--ink:#1b2129;--ink-2:#4b5563;--rule:#e8a33d}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
#stage{position:fixed;inset:0;background:var(--bg)}
#stage canvas{display:block;width:100%;height:100%}
#veil{position:fixed;inset:0;background:var(--bg);opacity:1;pointer-events:none;transition:opacity 1.2s ease}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.09) 100%)}
#mark{position:fixed;left:5vw;top:5vh;font:600 clamp(13px,1.15vw,18px) "Chakra Petch",system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);opacity:.8;transition:color .4s}
#scrim{position:fixed;left:0;bottom:0;width:48vw;height:26vh;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 22% 100%, var(--bg) 0%, var(--bg) 34%, transparent 66%)}
#cap{position:fixed;left:5vw;bottom:6vh;max-width:70vw;pointer-events:none}
#cap .r{width:42px;height:2px;background:var(--rule);margin-bottom:.9em;opacity:0}
#cap .t{font:600 clamp(22px,3.4vw,46px)/1.05 "Chakra Petch",system-ui,sans-serif;color:var(--ink);letter-spacing:.01em;text-wrap:balance;transition:color .4s;opacity:0}
#cap .s{font:400 clamp(15px,1.4vw,22px)/1.45 "Barlow","Helvetica Neue",Arial,sans-serif;color:var(--ink-2);margin-top:.45em;max-width:60ch;transition:color .4s;opacity:0}
body.dark #cap .t{color:#e9f1ff} body.dark #cap .s{color:#b9c9e2} body.dark #mark{color:#b9c9e2}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;font:500 14px "Barlow",sans-serif;color:var(--ink-2)}
#loading .bar{width:180px;height:2px;background:rgba(127,127,127,.15);margin-top:10px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:var(--ink-2);animation:slide 1.1s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
#pause{position:fixed;right:2vw;bottom:2vh;font:500 12px "Barlow",sans-serif;color:var(--ink-2);opacity:.6;pointer-events:none}
</style>
<div id="stage"></div>
<div id="vignette"></div>
<div id="mark">Hexapod MKII</div>
<div id="veil"></div>
<div id="scrim"></div>
<div id="cap"><div class="r"></div><div class="t"></div><div class="s"></div></div>
<div id="pause"></div>
<div id="loading"><div>Loading<div class="bar"><i></i></div></div></div>

<script id="blob" type="text/plain">__BLOB__</script>
<script type="module">

const MODEL = JSON.parse(document.getElementById("model").textContent);

{

    const c = worldCentre(m); let best = null, bd = Infinity;

const HERO = "lf";

const feet = V.meshes.filter(m => m.userData.part.startsWith("silicone_foot"));
const decals = feet.map(() => { const d = new THREE.Mesh(new THREE.CircleGeometry(0.042, 28), new THREE.MeshBasicMaterial({color:0x000000, alphaMap:decalTex, transparent:true, depthWrite:false, opacity:0})); d.position.z = FLOOR_Z + 0.0008; d.renderOrder = -1; V.scene.add(d); return d; });
const vtx = new THREE.Vector3();
function footLowest(f){
  const a = f.geometry.attributes.position; let best = null;
  for (let i = 0; i < a.count; i += 3) { vtx.fromBufferAttribute(a, i); f.localToWorld(vtx); if (!best || vtx.z < best.z) best = vtx.clone(); }

const footLow = feet.map(() => new THREE.Vector3());
function measureFeet(){ feet.forEach((f, i) => footLow[i].copy(footLowest(f))); return Math.min(...footLow.map(v => v.z)); }
function updateDecals(strength){
  feet.forEach((f, i) => {
    const lowest = footLow[i], h = lowest.z - FLOOR_Z, d = decals[i];
    d.position.x = lowest.x; d.position.y = lowest.y; d.material.opacity = strength * 0.55 * Math.max(0, Math.min(1, 1 - h / 0.03)); d.visible = d.material.opacity > 0.01 && f.visible;

const wipe = new THREE.Mesh(new THREE.CircleGeometry(1, 96), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, alphaMap:wipeTex, depthTest:false, depthWrite:false, fog:false}));
wipe.renderOrder = -20; wipe.visible = false; wipe.frustumCulled = false; V.scene.add(wipe);
const WIPE_DIST = 20;
function placeWipe(colour, u){
  wipe.visible = u > 0 && u < 1; if (!wipe.visible) return;
  const cam = V.camera; cam.updateMatrixWorld(true);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
  // the disc is centred beyond the bottom-left corner, so its edge sweeps diagonally across the frame
  const halfH = WIPE_DIST * Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2), halfW = halfH * cam.aspect;
  const rightV = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion), upV = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);

  const r = 0.2 + smooth(u) * reach; wipe.scale.set(r, r, 1); wipe.material.color.copy(colour);

const STANCE = MODEL.stance || {};
const ZERO = Object.fromEntries(Object.keys(jointVal).map(n => [n, 0]));
const EDGE_DARK = new THREE.Color(EDGE || (darkBg ? "#e3e9f2" : "#141a21")), EDGE_BP = new THREE.Color("#9fd3ff");
const BG_MAIN = new THREE.Color(BG), BG_BP = new THREE.Color("#0b2545");
const smooth = u => u <= 0 ? 0 : u >= 1 ? 1 : u*u*(3 - 2*u);
const lerp = (a, b, u) => a + (b - a) * u;
// perceptual colour blend (OKLab) so white -> navy never passes through muddy grey
const toLin = v => v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
