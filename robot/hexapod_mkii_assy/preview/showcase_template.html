<title>Hexapod MKII Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Barlow:wght@400;500&display=swap">
<style>
:root{--bg:#ffffff;--ink:#1b2129;--ink-2:#6b7684}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
#stage{position:fixed;inset:0;background:var(--bg)}
#stage canvas{display:block;width:100%;height:100%}
#fade{position:fixed;inset:0;background:var(--bg);opacity:1;pointer-events:none;transition:opacity .45s ease}
#cap{position:fixed;left:4.5vw;bottom:5vh;max-width:70vw;pointer-events:none;opacity:0;transition:opacity .6s ease}
#cap .t{font:600 clamp(20px,3.2vw,44px)/1.05 "Chakra Petch",system-ui,sans-serif;color:var(--ink);letter-spacing:.01em;text-wrap:balance}
#cap .s{font:400 clamp(13px,1.3vw,18px)/1.4 "Barlow","Helvetica Neue",Arial,sans-serif;color:var(--ink-2);margin-top:.4em;max-width:60ch}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;font:500 14px "Barlow",sans-serif;color:var(--ink-2)}
#loading .bar{width:180px;height:2px;background:rgba(0,0,0,.08);margin-top:10px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:var(--ink-2);animation:slide 1.1s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
#pause{position:fixed;right:2vw;bottom:2vh;font:500 12px "Barlow",sans-serif;color:var(--ink-2);opacity:.6;pointer-events:none}
</style>
<div id="stage"></div>
<div id="fade"></div>
<div id="cap"><div class="t"></div><div class="s"></div></div>
<div id="pause"></div>
<div id="loading"><div>Loading<div class="bar"><i></i></div></div></div>
<script id="model" type="application/json">__MODEL__</script>
<script id="blob" type="text/plain">__BLOB__</script>
<script type="module">
import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";
__CORE_JS__
const MODEL = JSON.parse(document.getElementById("model").textContent);
const BLOB = document.getElementById("blob").textContent.trim();
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const hex = (k, d) => "#" + (P.get(k) || d).replace("#", "");
const BG = hex("bg", "ffffff"), FACE = hex("face", "f4f6f8"), EDGE = P.get("edge") ? hex("edge", "141a21") : null;
const CAPTIONS = P.get("captions") !== "0", SPEED = parseFloat(P.get("speed") || 1), ONLY = P.get("shots") ? P.get("shots").split(",") : null;
document.documentElement.style.setProperty("--bg", BG);
const lum = c => { const n = parseInt(c.slice(1), 16); return (0.2126*(n>>16) + 0.7152*((n>>8)&255) + 0.0722*(n&255)) / 255; };
if (lum(BG) < 0.5) { document.documentElement.style.setProperty("--ink", "#f2f4f7"); document.documentElement.style.setProperty("--ink-2", "#aab3bf"); }

const V = createHexapodCore(THREE, MODEL, BLOB, $("stage"), {});
V.setBackground(BG); V.setFaceColor(FACE); if (EDGE) V.setEdgeColor(EDGE); V.setGrid(false);
if (lum(BG) < 0.5 && !EDGE) V.setEdgeColor("#e3e9f2");
const {state, view, jointVal} = V;
const STANCE = MODEL.stance || {};
const smooth = u => u < 0 ? 0 : u > 1 ? 1 : u*u*(3 - 2*u);
const lerp = (a, b, u) => a + (b - a) * u;
const legCentre = name => V.linkObj[name].localToWorld(V.linkRest[name].centreLocal.clone());

// reference distances: assembled and fully exploded framings
let r0, rExpFactor, targetExp;
function computeFramings(){
  V.setPose(STANCE); V.setExplode(0, 0); V.update(); V.robot.updateMatrixWorld(true);
  view.theta = -1.15; view.phi = 1.08; V.frameVisible(0.82); r0 = view.r; const t0 = view.target.clone();
  V.setExplode(1, 0.6); V.update(); V.robot.updateMatrixWorld(true); V.frameVisible(0.86); rExpFactor = view.r / r0; targetExp = view.target.clone();
  V.setExplode(0, 0); view.target.copy(t0); view.r = r0;
}
computeFramings();
addEventListener("resize", () => { V.resize($("stage").clientWidth, $("stage").clientHeight); computeFramings(); });

// ---------- the sequence: each shot sets its look on enter and animates with u in [0,1]
const centre = () => V.centre.clone();
const SHOTS = [
  {id:"reveal", dur:9, title:"Hexapod MKII", sub:"Six legs, eighteen RobStride RS05 actuators, 8.26 kg",
    enter(){ V.setStyle("shaded"); V.setShadows(true); V.setPose(STANCE); V.setExplode(0, 0); },
    frame(u){ const s = smooth(u); view.theta = lerp(-1.65, -0.85, s); view.phi = lerp(1.22, 1.05, s); view.r = r0 * lerp(1.12, 0.92, s); view.target.copy(centre()); }},
  {id:"fly", dur:10, title:"Leg drive", sub:"Yaw, hip and knee motors; the knee runs through a parallelogram linkage",
    enter(){ V.setStyle("shaded"); V.setShadows(true); V.setPose(STANCE); V.setExplode(0, 0); },
    frame(u){ const k = [ {t:centre(), th:-1.3, ph:1.12, r:0.92}, {t:legCentre("lf_coxa"), th:-0.55, ph:1.32, r:0.32}, {t:legCentre("lf_femur"), th:0.15, ph:1.05, r:0.30}, {t:legCentre("lf_tibia"), th:0.55, ph:0.95, r:0.42} ];
      const x = u * (k.length - 1), i = Math.min(k.length - 2, Math.floor(x)), s = smooth(x - i), a = k[i], b = k[i+1];
      view.theta = lerp(a.th, b.th, s); view.phi = lerp(a.ph, b.ph, s); view.r = r0 * lerp(a.r, b.r, s); view.target.copy(a.t).lerp(b.t, s); }},
  {id:"explode", dur:11, title:"Exploded", sub:"1,369 parts. Assemblies leave the body, then every fastener along its own axis",
    enter(){ V.setStyle("white"); V.setShadows(false); V.setPose(STANCE); },
    frame(u){ const e1 = smooth(u / 0.4), e2 = smooth((u - 0.32) / 0.35); V.setExplode(e1, 0.6 * e2);
      const s = smooth(u); view.theta = lerp(-1.05, -0.15, u); view.phi = lerp(1.1, 1.0, s); const f = smooth(u / 0.7); view.r = r0 * lerp(0.95, rExpFactor, f); view.target.copy(centre()).lerp(targetExp, f); }},
  {id:"blueprint", dur:9, title:"Blueprint", sub:"Hidden-line edges of the STEP solids",
    enter(){ V.setStyle("blueprint"); V.setShadows(false); },
    frame(u){ const back = smooth((u - 0.55) / 0.4); V.setExplode(1 - back, 0.6 * (1 - back));
      view.theta = lerp(-0.15, 0.95, u); view.phi = 1.02; view.r = r0 * lerp(rExpFactor, 0.95, back); view.target.copy(targetExp).lerp(centre(), back); }},
  {id:"xray", dur:8, title:"X-ray", sub:"Motor housings inside the limbs and the yaw drives under the deck",
    enter(){ V.setStyle("ghost"); V.setShadows(false); V.setExplode(0, 0); V.classVisible.fastener = false; V.applyMode(); },
    exit(){ V.classVisible.fastener = true; V.applyMode(); },
    frame(u){ view.theta = lerp(0.95, 1.95, u); view.phi = lerp(1.2, 1.05, smooth(u)); view.r = r0 * 0.82; view.target.copy(centre()); }},
  {id:"section", dur:9, title:"Section sweep", sub:"A cutting plane travels through the chassis and the middle legs",
    enter(){ V.setStyle("shaded"); V.setShadows(false); V.setExplode(0, 0); },
    exit(){ V.setSection("off"); },
    frame(u){ V.setSection("y", lerp(-1, 1, smooth(u)), 1); view.theta = lerp(-1.0, -0.8, u); view.phi = 1.1; view.r = r0 * 0.9; view.target.copy(centre()); }},
  {id:"walk", dur:12, title:"Tripod gait", sub:"Three legs swing while three stand; the policy in Isaac Lab trains on this asset",
    enter(){ V.setStyle("shaded"); V.setShadows(true); V.setExplode(0, 0); },
    frame(u, t){ V.setPose(V.gait(t)); view.theta = lerp(-1.25, -0.35, u); view.phi = 1.32; view.r = r0 * 0.98; view.target.copy(centre()); }},
  {id:"plan", dur:7, title:"Plan view", sub:"978 × 766 mm footprint with the legs at rest",
    enter(){ V.setStyle("hidden"); V.setShadows(false); V.setPose({}); },
    frame(u){ V.setExplode(0.35 * smooth(u / 0.5), 0); view.theta = lerp(-Math.PI/2, -Math.PI/2 + 0.5, u); view.phi = 0.03; view.r = r0 * 1.0; view.target.copy(centre()); }},
].filter(s => !ONLY || ONLY.includes(s.id));
const TOTAL = SHOTS.reduce((s, x) => s + x.dur, 0);

// ---------- timeline
let paused = false, pauseAt = 0, offset = 0, current = -1;
const clock = new THREE.Clock();
addEventListener("click", () => { paused = !paused; if (paused) pauseAt = clock.getElapsedTime(); else offset += clock.getElapsedTime() - pauseAt; $("pause").textContent = paused ? "paused — click to resume" : ""; });
$("loading").remove();
setTimeout(() => { $("fade").style.opacity = 0; }, 100);
renderer_loop();
function renderer_loop(){
  V.renderer.setAnimationLoop(() => {
    const now = paused ? pauseAt : clock.getElapsedTime();
    const t = ((now - offset) * SPEED) % TOTAL;
    let acc = 0, idx = 0; while (idx < SHOTS.length - 1 && t >= acc + SHOTS[idx].dur) { acc += SHOTS[idx].dur; idx++; }
    const shot = SHOTS[idx], local = t - acc, u = local / shot.dur;
    if (idx !== current) {
      if (current >= 0 && SHOTS[current].exit) SHOTS[current].exit();
      current = idx; shot.enter();
      $("cap .t"); const cap = $("cap"); cap.querySelector(".t").textContent = shot.title; cap.querySelector(".s").textContent = shot.sub;
    }
    const remaining = shot.dur - local;
    $("fade").style.opacity = local < 0.45 ? 1 - local / 0.45 : remaining < 0.45 ? 1 - remaining / 0.45 : 0;
    $("cap").style.opacity = CAPTIONS && local > 0.7 && remaining > 0.8 ? 1 : 0;
    shot.frame(u, now - offset);
    V.update(); V.render();
  });
}
</script>
