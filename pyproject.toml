[project]
name = "hexapod-cupi"
version = "0.1.0"
description = "Hexapod MKII autonomy: locomotion training, contracts, runtime, navigation seam, and evidence."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
# CPU verification dependencies. Native simulation uses the pinned Spark image.
dev = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.9",
    "usd-core==26.8",
    "scipy>=1.14",
    "trimesh>=4.0",
    "rtree>=1.3",
    "casadi>=3.7,<3.8",
    "rsl-rl-lib==5.0.1",
]
# Host-side upload of retrieved runs; the pinned Spark image does not install wandb.
tracking = [
    "wandb>=0.30.0",
]

[tool.uv]
# Import maintained packages from the repository root.
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
