[project]
name = "hexapod-cupi"
version = "0.1.0"
description = "Hexapod MKII autonomy: locomotion training, contracts, runtime, navigation seam, and evidence."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
# CPU verification dependencies. Native simulation uses the pinned Spark image.
dev = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.9",
    "usd-core==26.8",
    "scipy>=1.14",
    "rsl-rl-lib==5.0.1",
    "casadi==3.7.2",
    "mujoco==3.14.0",
    "ruff==0.17.1",
]
# Matches the Spark image, which writes W&B runs; use it to log in and sync offline runs.
tracking = [
    "wandb==0.28.2",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The importable packages live under src/; uv sync installs them in editable mode.
module-name = ["locomotion", "navigation", "mission", "contracts"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
required-version = "==0.17.1"
target-version = "py312"
line-length = 100
force-exclude = true
# These files are immutable evidence, including the byte-identical scoring oracle.
extend-exclude = [
    "**/tests/fixtures/**",
    "src/locomotion/evaluation/scoring.py",
    "src/locomotion/hexapod/**",
    "site/assets/**",
    "graphify-out/**",
    "artifacts/**",
    "runs/**",
    "tmp/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
