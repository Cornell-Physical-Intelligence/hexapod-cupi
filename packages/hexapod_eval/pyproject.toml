[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexapod-eval"
version = "0.1.0"
description = "Acceptance gates, screen parameters, and evaluation dispatch for the RobStride hexapod."
requires-python = ">=3.10"

# Deliberately empty. `gates.py` is pure stdlib data and `dispatch.py` only
# execs an existing script under the current interpreter, so this package runs
# under a bare system interpreter on an operator's laptop as well as inside the
# Isaac Lab container.
dependencies = []

[tool.setuptools]
packages = ["hexapod_eval"]
