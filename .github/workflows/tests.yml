name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the pinned interpreter
        run: uv python install
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Test maintained packages and archive boundaries
        run: |
          for suite in contracts navigation mission robot locomotion locomotion/priors; do
            uv run python -m unittest discover -s "$suite/tests"
          done
          uv run python -m unittest discover -s tests
      - name: Verify source and canonical input identities
        run: |
          uv run python tools/source_inventory.py check
          uv run python tools/archive.py check
          uv run python -m locomotion.inputs check
          uv run python tools/check_pipeline_lineages.py current
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build the approved robot viewer
        working-directory: viewer
        run: |
          npm ci
          npm run build
