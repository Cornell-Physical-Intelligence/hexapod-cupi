name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the pinned interpreter
        run: uv python install

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Run the test suite
        run: uv run python -m unittest discover -s isaaclab/tests

      - name: Verify the pipeline manifest
        run: sha256sum -c isaaclab/deploy/stage2_pipeline.sha256
