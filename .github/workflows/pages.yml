name: Research poster
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-poster-${{ github.ref }}
  cancel-in-progress: true
jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the contributor and evidence checks
        run: python3 -m unittest discover -s isaaclab/tests -p 'test_project*.py'
      - name: Require a central update for every repository change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 tools/project_site.py check --base "$BASE_SHA"
          else
            python3 tools/project_site.py check
          fi
      - name: Build the verified research poster
        run: python3 tools/project_site.py build
      - name: Exercise the built roadmap renderer
        run: node site/test_render.mjs
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload the selected public site only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: poster
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy research poster
        id: deployment
        uses: actions/deploy-pages@v4
