name: Research poster
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-poster-${{ github.ref }}
  cancel-in-progress: true
jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned source evidence
        run: git fetch --filter=blob:none --no-tags --depth=1 origin 02f551fd97c240d7ca1724618fa7f0429065f0e1 7d07566545d2bc9c6ebaa0e4dc3d49c626a1a258 077b98b1b6150e8cc54ad233c90198fdece0d7bb 969ea5bc942df3122b2662650f29acd11644a41c 5dd66a09214848b7433c326125acad6263c893b7 467e7e101f0149d131b26ce84993347d8c77e233 b92f14ec39a933a83615dd65e08e1479161b989d
      - name: Test the contributor and evidence checks
        run: python3 -m unittest discover -s tests -p 'test_project*.py'
      - name: Require a central update for every repository change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --filter=blob:none --no-tags --depth=1 origin "$BASE_SHA"
            python3 tools/project_site.py check --base "$BASE_SHA"
          else
            python3 tools/project_site.py check
          fi
      - name: Build the verified research poster
        run: python3 tools/project_site.py build
      - name: Exercise the built roadmap renderer
        run: |
          node site/test_render.mjs
          node site/test_code_map.mjs
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload the selected public site only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: poster
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy research poster
        id: deployment
        uses: actions/deploy-pages@v4
